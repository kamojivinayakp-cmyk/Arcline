<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arcline Design Studio</title>
<style>
:root{--bg:#111;--fg:#fff;--soft:rgba(255,255,255,.72);--cu:#B8935A;--gr:#1F5C45;--serif:"Cormorant Garamond",Georgia,serif;--sans:Inter,system-ui,-apple-system,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:var(--sans);overflow:hidden}
#app{position:relative;width:100%;height:100dvh;overflow:hidden;background:#000}
body.framed #app{width:390px;height:min(844px,calc(100dvh - 40px));margin:20px auto;border-radius:36px}
#scr{position:absolute;inset:0;overflow-y:scroll;scroll-snap-type:y mandatory;touch-action:pan-y;scrollbar-width:none;overscroll-behavior:contain}
#scr::-webkit-scrollbar{display:none}
.slide{height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;position:relative}
.img{position:absolute;inset:0;background-size:cover;background-position:center;transition:transform .25s ease;will-change:transform}
.slide::before,.slide::after{content:"";position:absolute;left:0;right:0;pointer-events:none;z-index:1}
.slide::before{top:0;height:22%;background:linear-gradient(to bottom,rgba(0,0,0,.4),transparent)}
.slide::after{bottom:0;height:50%;background:linear-gradient(to top,rgba(0,0,0,.55),transparent)}
.slide.td::before{background:linear-gradient(to bottom,rgba(255,255,255,.55),transparent)}
.slide.bd::after{background:linear-gradient(to top,rgba(255,255,255,.62),transparent)}
.bot,.lab,.dots{--fg:#fff;--soft:rgba(255,255,255,.75)}
#app.bd .bot,#app.bd .lab,#app.bd .dots{--fg:#1c1a17;--soft:rgba(28,26,23,.78);--cu:#8A6A36}
.bot{color:var(--fg)}
.name{color:var(--fg)}
.ui{position:absolute;left:0;right:0;z-index:5;pointer-events:none;transition:opacity .5s ease}
#app.hide .ui,#app.zoomed .ui{opacity:0}
#app.hide .ui *,#app.zoomed .ui *{pointer-events:none!important}
.top{top:0;padding:calc(env(safe-area-inset-top,0px) + 16px) 20px 0;display:flex;justify-content:flex-start;align-items:center}
.logo{font-family:var(--serif);font-size:22px;letter-spacing:.32em;font-weight:600}
.ib{pointer-events:auto;width:40px;height:40px;border:0;background:none;color:var(--fg);display:grid;place-items:center;cursor:pointer}
.ib svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.5}
.bot{bottom:0;padding:0 22px calc(env(safe-area-inset-bottom,0px) + 28px)}
#info{transition:opacity .3s ease}
#info.sw{opacity:0}
.name{font-family:var(--serif);font-size:38px;line-height:1.05;font-weight:500;margin:0 0 10px;max-width:15ch}
.meta{font-size:12px;letter-spacing:.14em;color:var(--soft);margin:0 0 14px}
.line{font-size:14px;line-height:1.5;color:var(--soft);margin:0;max-width:34ch}
.tag{display:inline-block;font-size:11px;letter-spacing:.12em;border-bottom:1px solid var(--cu);padding-bottom:3px;margin-bottom:12px}
.hintsw{margin-top:22px;font-size:11px;letter-spacing:.2em;color:var(--soft)}
.cta{pointer-events:auto;display:inline-block;margin-top:20px;background:var(--cu);color:#fff;border:0;border-radius:40px;padding:14px 26px;font:600 13px var(--sans);letter-spacing:.08em;text-decoration:none}
.links{pointer-events:auto;margin-top:18px;font-size:13px;color:var(--soft)}
.links a{color:var(--soft);margin-right:18px}
.lab{position:absolute;right:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 30px);display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:10px;letter-spacing:.1em;color:var(--soft)}
.dots{position:absolute;right:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:9px;z-index:5;transition:opacity .5s}
#app.hide .dots,#app.zoomed .dots{opacity:0}
.dots i{width:3px;height:3px;border-radius:2px;background:var(--soft);transition:all .3s}
.dots i.on{background:var(--cu);height:18px}
#hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:6;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:12px 20px;border-radius:30px;font-size:13px;letter-spacing:.06em;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .6s}
#hint.on{opacity:1}
.logo small{display:block;font:500 8px var(--sans);letter-spacing:.34em;margin-top:3px;text-align:center;color:var(--soft)}
.logo img{height:30px;width:auto;display:block}
.cta.g{background:var(--gr)}
.ref{pointer-events:auto;display:block;margin-top:14px;font-size:13px;color:#fff;text-decoration:underline;text-underline-offset:4px;max-width:30ch;line-height:1.4}
#gate{display:none;position:fixed;inset:0;z-index:20;background:#111;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px}
body.gate #gate{display:flex}
body.gate #app{display:none}
#gate h1{font:500 40px var(--serif);margin:26px 0 8px}
#gate p{color:var(--soft);margin:0 0 26px;font-size:15px}
#qr{background:#fff;padding:10px;border-radius:12px;min-height:152px;min-width:152px}
#gate button{margin-top:28px;background:none;border:0;border-bottom:1px solid var(--soft);color:var(--soft);font:13px var(--sans);padding:0 0 3px;cursor:pointer}
#app.end .bot{top:0;bottom:0;display:flex;align-items:center;justify-content:center;padding:70px 20px 30px}
#app.end #info{width:100%}
.endc{pointer-events:auto;text-align:center;background:rgba(18,14,10,.5);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.16);border-radius:28px;padding:30px 22px 24px}
.endc .k{font-size:11px;letter-spacing:.22em;color:var(--cu);margin:0 0 12px}
.endc h2{font:500 34px/1.08 var(--serif);margin:0 0 10px}
.endc .line{margin:0 auto;text-align:center}
.endc .cta{display:block;margin:22px 0 0;padding:17px 20px;font-size:14px;box-shadow:0 10px 26px rgba(31,92,69,.5)}
.endc hr{border:0;border-top:1px solid rgba(255,255,255,.16);margin:24px 0 18px}
.endc .rf{display:block;text-decoration:none;color:#fff;border:1px solid var(--cu);border-radius:18px;padding:14px 16px}
.endc .rf b{display:block;font:500 20px var(--serif);margin-bottom:4px}
.endc .rf span{display:block;font-size:12px;color:var(--soft);line-height:1.4}
.endc .rf em{display:inline-block;margin-top:10px;font:600 11px var(--sans);letter-spacing:.14em;font-style:normal;color:var(--cu)}
.endc .st{margin-top:18px;font-size:11px;letter-spacing:.06em;color:var(--soft)}
.hint2{top:30%;right:4px;left:auto;--fg:#fff;--soft:rgba(255,255,255,.75);display:none}
#app.bd .hint2{--fg:#1c1a17;--soft:rgba(28,26,23,.78)}
.hint2 button{pointer-events:auto;background:none;border:0;color:var(--soft);font:600 10px var(--sans);letter-spacing:.18em;writing-mode:vertical-rl;padding:10px 6px;cursor:pointer}
#app.phopen .bot,#app.phopen .lab,#app.phopen .hint2{opacity:0;pointer-events:none}
.slide.ph::before,.slide.ph::after{opacity:0}
.phl{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;justify-content:center;padding:96px 28px 56px;background:rgba(14,12,10,.74);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);color:#fff;transform:translateX(102%);transition:transform .5s cubic-bezier(.7,0,.2,1)}
.slide.ph .phl{transform:none}
.phl .pk{font-size:11px;letter-spacing:.22em;color:var(--cu);margin-bottom:8px}
.phl h3{font:500 30px/1.1 var(--serif);margin:0 0 26px}
.phl .pl{font-size:10px;letter-spacing:.2em;color:var(--cu);margin-bottom:6px}
.phl p{font-size:15px;line-height:1.6;color:rgba(255,255,255,.82);margin:0 0 20px;max-width:34ch}
.phl .sw{display:flex;gap:10px;margin:2px 0 26px}
.phl .sw i{width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.35)}
.phl .pback{align-self:flex-start;background:none;border:0;border-bottom:1px solid rgba(255,255,255,.5);color:#fff;font:12px var(--sans);letter-spacing:.1em;padding:0 0 3px;cursor:pointer}
.phb{pointer-events:auto;display:inline-flex;align-items:center;gap:8px;margin-top:16px;background:none;color:var(--fg);border:1px solid var(--soft);border-radius:20px;padding:8px 14px;font:600 10px var(--sans);letter-spacing:.18em;cursor:pointer}
.phb b{font-size:15px;line-height:1;animation:nudge 1.8s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

var phOpen=false,sls=[];
var cur=0,s=1,tx=0,ty=0,imgs=[],tmr,store=null;
try{store=window.localStorage}catch(e){}

if(LOGO)[].forEach.call(document.querySelectorAll('[data-logo]'),function(e){e.innerHTML='<img alt="Arcline Design Studio" src="'+LOGO+'">'});
// Desktop gate
var desk=window.matchMedia('(min-width:820px) and (hover:hover) and (pointer:fine)').matches&&!(navigator.maxTouchPoints>0);
if(desk){document.body.classList.add('gate');try{new QRCode($('#qr'),{text:location.href,width:132,height:132,colorDark:'#111',colorLight:'#fff'})}catch(e){}}
$('#cont').onclick=function(){document.body.classList.remove('gate');document.body.classList.add('framed')};

// Build slides + dots
P.forEach(function(p,i){
  var sl=document.createElement('section');sl.className='slide';
  var im=document.createElement('div');im.className='img';im.style.backgroundImage=p.img?'url('+p.img+')':p.bg;p.tt=p.bt='l';
  sl.appendChild(im);scr.appendChild(sl);imgs.push(im);
  var d=document.createElement('i');dots.appendChild(d);sls.push(sl);
  if(p.phil){var pn=document.createElement('div');pn.className='phl';
    pn.innerHTML='<div class="pk">DESIGN PHILOSOPHY</div><h3>'+p.name+'</h3>'+(p.phil.idea?'<div class="pl">THE IDEA</div><p>'+p.phil.idea+'</p>':'')+''+(p.phil.mat?'<div class="pl">MATERIALS AND PALETTE</div><p>'+p.phil.mat+'</p>':'')+((p.phil.sw||[]).length?'<div class="sw">'+(p.phil.sw||[]).map(function(c){return '<i style="background:'+encodeURI(c)+'"></i>'}).join('')+'</div>':'')+''+(p.phil.space?'<div class="pl">SPATIAL THINKING</div><p>'+p.phil.space+'</p>':'')+'<button class="pback">‹ Back to render</button>';
    pn.querySelector('.pback').onclick=function(e){e.stopPropagation();openPh(false)};
    pn.addEventListener('click',function(e){e.stopPropagation()});sl.appendChild(pn)}
  if(p.img){var t=new Image();t.onload=function(){var c=document.createElement('canvas');c.width=60;c.height=106;var x=c.getContext('2d');x.drawImage(t,0,0,60,106);
    function lum(a,b){var d=x.getImageData(0,a,60,b-a).data,s=0,n=0;for(var k=0;k<d.length;k+=4){s+=.2126*d[k]+.7152*d[k+1]+.0722*d[k+2];n++}return s/n}
    p.tt=lum(0,15)>150?'d':'l';p.bt=lum(66,106)>150?'d':'l';if(p.tone==='light')p.tt=p.bt='l';if(p.tone==='dark')p.tt=p.bt='d';
    sl.classList.toggle('td',p.tt==='d');sl.classList.toggle('bd',p.bt==='d');if(P.indexOf(p)===cur)tones(cur)};t.crossOrigin='anonymous';t.src=p.img}
});

function tones(i){var p=P[i];app.classList.toggle('bd',p.bt==='d'&&!phOpen);var l=document.querySelector('.top img');if(l)l.src=(p.tt==='d'&&!phOpen)?LOGO_D:LOGO}
function openPh(o){var p=P[cur];if(!p.phil&&o)return;phOpen=o;sls[cur].classList.toggle('ph',o);app.classList.toggle('phopen',o);tones(cur);if(o){clearTimeout(tmr);app.classList.remove('hide')}else show()}
info.addEventListener('click',function(e){if(e.target.closest('#phb')){e.stopPropagation();openPh(true)}});
function setInfo(i){tones(i);
  var p=P[i],h='';
  if(p.t==='open')h='<h1 class="name" style="font-size:38px;max-width:12ch">Better interiors start here.</h1><p class="line">Planned. Clear. Reliable. Designed around you.</p><div class="hintsw">SWIPE TO EXPLORE</div>';
  else if(p.t==='p')h='<div class="tag">'+p.space+'</div><h2 class="name">'+p.name+'</h2><p class="meta">'+p.meta+'</p><p class="line">'+p.line+'</p>'+(p.phil?'<button class="phb" id="phb"><span>DESIGN PHILOSOPHY</span><b>›</b></button>':'');
  else h='<div class="endc"><p class="k">FREE ROOM DESIGN</p><h2>Claim your free room design.</h2><p class="line">Pick a room. We design it for you at no cost.</p><a class="cta g" target="_blank" rel="noopener" href="https://kamojivinayakp-cmyk.github.io/Arcline/#claim">CLAIM FREE DESIGN</a><hr><a class="rf" target="_blank" rel="noopener" href="https://kamojivinayakp-cmyk.github.io/Arcline/refer.html?source=qr-refer"><b>Know a new homeowner?</b><span>Earn up to 5% of their project value</span><em>REFER AND EARN</em></a><div class="st">20+ homes designed · 10-year warranty on interiors</div></div>';
  info.classList.add('sw');
  setTimeout(function(){info.innerHTML=h;info.classList.remove('sw')},220);
  $('#lab').style.display=p.t==='p'?'flex':'none';
  [].forEach.call(dots.children,function(d,k){d.className=k===i?'on':''});
}

// UI show / auto-hide
function show(){app.classList.remove('hide');clearTimeout(tmr);if(cur===P.length-1||phOpen)return;tmr=setTimeout(function(){app.classList.add('hide')},3000)}
function toggle(){if(cur===P.length-1||phOpen)return;app.classList.contains('hide')?show():(clearTimeout(tmr),app.classList.add('hide'))}

// Zoom
function clamp(){var mx=(s-1)*app.clientWidth/2,my=(s-1)*app.clientHeight/2;tx=Math.max(-mx,Math.min(mx,tx));ty=Math.max(-my,Math.min(my,ty))}
function apply(){imgs[cur].style.transform='translate('+tx+'px,'+ty+'px) scale('+s+')';scr.style.overflowY=s>1?'hidden':'scroll';scr.style.touchAction=s>1?'none':'pan-y';app.classList.toggle('zoomed',s>1)}
function reset(){s=1;tx=ty=0;apply()}
function zoomTo(v){s=v;if(v===1){tx=ty=0}clamp();apply();if(v===1)show()}
$('#zbtn').onclick=function(){zoomTo(s>1?1:2.5)};

var d0=0,s0=1,lx=0,ly=0;
function dist(e){var a=e.touches[0],b=e.touches[1];return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)}
scr.addEventListener('touchstart',function(e){if(e.touches.length===2){d0=dist(e);s0=s}else{lx=e.touches[0].clientX;ly=e.touches[0].clientY}},{passive:true});
scr.addEventListener('touchmove',function(e){
  if(e.touches.length===2){e.preventDefault();s=Math.max(1,Math.min(4,s0*dist(e)/d0));clamp();apply()}
  else if(s>1){e.preventDefault();var t=e.touches[0];tx+=t.clientX-lx;ty+=t.clientY-ly;lx=t.clientX;ly=t.clientY;clamp();apply()}
},{passive:false});
scr.addEventListener('touchend',function(e){if(s<1.05)reset();else if(e.touches.length===1){lx=e.touches[0].clientX;ly=e.touches[0].clientY}});

// Horizontal swipe: left opens philosophy, right closes
var sx=0,sy=0,multi=false;
scr.addEventListener('touchstart',function(e){multi=e.touches.length>1;sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
scr.addEventListener('touchmove',function(e){if(e.touches.length>1)multi=true},{passive:true});
scr.addEventListener('touchend',function(e){if(multi||s>1)return;var t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
  if(Math.abs(dx)>40&&Math.abs(dx)>1.2*Math.abs(dy)){if(dx<0&&!phOpen)openPh(true);else if(dx>0&&phOpen)openPh(false)}});
// Tap = toggle UI, double tap = zoom
var lastTap=0,tapT;
scr.addEventListener('click',function(){
  var n=Date.now();
  if(n-lastTap<300){clearTimeout(tapT);lastTap=0;zoomTo(s>1?1:2.5)}
  else{lastTap=n;tapT=setTimeout(function(){if(s===1)toggle()},300)}
});

// Slide change
scr.addEventListener('scroll',function(){
  var i=Math.round(scr.scrollTop/scr.clientHeight);
  if(i!==cur&&i>=0&&i<P.length){if(phOpen){sls[cur].classList.remove('ph');app.classList.remove('phopen');phOpen=false}imgs[cur].style.transform='';s=1;tx=ty=0;cur=i;app.classList.toggle('end',i===P.length-1);setInfo(i);show()}
},{passive:true});

// First-visit hint
setInfo(0);show();
var seen=false;try{seen=store&&store.getItem('arc_hint')}catch(e){}
if(!seen){setTimeout(function(){hint.classList.add('on');setTimeout(function(){hint.classList.remove('on')},3000)},900);try{store&&store.setItem('arc_hint','1')}catch(e){}}
}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function mapRow(r){var meta=[r.home_type,r.area?r.area+' SQ FT':'',r.location].filter(Boolean).join(' · ').toUpperCase(),has=r.phil_idea||r.phil_materials||r.phil_space;
  return{t:'p',name:esc(r.name),meta:esc(meta),space:r.featured_space?'FEATURED SPACE: '+esc(r.featured_space.toUpperCase()):'',line:esc(r.concept),img:r.image_url,bg:'#222',tone:r.text_tone,
    phil:has?{idea:esc(r.phil_idea),mat:esc(r.phil_materials),space:esc(r.phil_space),sw:(r.swatches||[]).filter(function(c){return /^#[0-9a-fA-F]{3,8}$/.test(c)})}:null}}
fetch(SB_URL+'/rest/v1/projects?published=eq.true&order=sort_order.asc,created_at.asc&select=*',{headers:{apikey:SB_KEY}})
  .then(function(r){return r.json()}).then(function(rows){
    if(!Array.isArray(rows))return;
    var hero=rows.filter(function(r){return r.is_hero})[0];
    if(hero){P[0].img=hero.image_url;P[0].bg='#222';P[0].tone=hero.text_tone}
    var items=rows.filter(function(r){return !r.is_hero}).map(mapRow);
    P.splice.apply(P,[1,0].concat(items))})
  .catch(function(){}).then(boot);
