<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Arcline Admin</title>
<style>
:root{--bg:#f6f1e7;--ink:#1c1a17;--mut:#6b645a;--gr:#1F5C45;--line:#d9d0c0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,sans-serif}
.w{max-width:620px;margin:0 auto;padding:20px}h1{font:600 24px Georgia,serif;margin:0 0 14px}h2{font:600 18px Georgia,serif;margin:0 0 6px}
label{display:block;font-size:12px;letter-spacing:.06em;color:var(--mut);margin:12px 0 4px}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit}
input[type=checkbox]{width:auto;margin-right:8px}textarea{min-height:70px}
button{background:var(--gr);color:#fff;border:0;border-radius:10px;padding:12px 16px;font:600 14px system-ui;cursor:pointer}
button.s{background:#fff;color:var(--ink);border:1px solid var(--line);padding:6px 10px;font-weight:500;font-size:13px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:18px}
.row{display:flex;gap:10px}.row>*{flex:1}
.it{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.it img{width:52px;height:90px;object-fit:cover;border-radius:6px}
.bt{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
#pv{width:90px;border-radius:8px;margin-top:8px}.hid{display:none}
#msg{margin:12px 0 0;font-size:14px;color:var(--gr)}#msg.e,#lerr{color:#a3321f}
.top{display:flex;justify-content:space-between;align-items:center}
</style></head><body><div class="w">

<div id="login" class="card hid"><h1>Arcline admin</h1>
  <label>Email</label><input id="em" type="email" autocomplete="username">
  <label>Password</label><input id="pw" type="password" autocomplete="current-password">
  <p id="lerr"></p><button id="in">Sign in</button></div>

<div id="app" class="hid">
  <div class="top"><h1>Arcline admin</h1><button class="s" id="out">Sign out</button></div>
  <div class="card"><h2 id="ft">New render</h2>
    <label>RENDER (portrait, 9:19.5 works best)</label><input id="file" type="file" accept="image/*"><img id="pv" class="hid" alt="">
    <label>PROJECT NAME</label><input id="nm">
    <div class="row"><div><label>HOME TYPE</label><input id="ht" placeholder="3 BHK / Villa"></div><div><label>AREA (SQ FT)</label><input id="ar" inputmode="numeric"></div></div>
    <label>LOCATION</label><input id="lc">
    <label>FEATURED SPACE</label><input id="fs" placeholder="Living Room">
    <label>ONE-LINE CONCEPT</label><textarea id="cc"></textarea>
    <label>TEXT COLOUR</label><select id="tn"><option value="auto">Auto (recommended)</option><option value="light">Always light text</option><option value="dark">Always dark text</option></select>
    <label><input type="checkbox" id="hero">Use as the opening screen (not shown as a project)</label>
    <h2 style="margin-top:20px">Design philosophy (optional)</h2>
    <label>THE IDEA</label><textarea id="p1"></textarea>
    <label>MATERIALS AND PALETTE</label><textarea id="p2"></textarea>
    <label>SPATIAL THINKING</label><textarea id="p3"></textarea>
    <label>SWATCH COLOURS (auto from render, edit if you like)</label><input id="sws" placeholder="#ECE9E6, #CEBEB2, ...">
    <p id="msg"></p>
    <div class="bt"><button id="save">Publish</button><button class="s hid" id="cancel">Cancel edit</button></div>
  </div>
  <div class="card"><h2>Published renders</h2><div id="list"></div></div>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
var SB_URL='https://noowdyzfjezexhgewuor.supabase.co',SB_KEY='sb_publishable_XQWcHHEHJ1Xxaw46lNxP1w_3kPeB-7K';
var sb=supabase.createClient(SB_URL,SB_KEY);
var $=function(s){return document.querySelector(s)},edit=null,blob=null,rows=[];
function v(id){return $('#'+id).value.trim()}
function msg(t,e){var m=$('#msg');m.textContent=t;m.className=e?'e':''}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function show(on){$('#login').classList.toggle('hid',on);$('#app').classList.toggle('hid',!on);if(on)load()}
sb.auth.getSession().then(function(r){show(!!r.data.session)});
$('#in').onclick=async function(){var r=await sb.auth.signInWithPassword({email:v('em'),password:$('#pw').value});if(r.error)return $('#lerr').textContent=r.error.message;show(true)};
$('#out').onclick=async function(){await sb.auth.signOut();show(false)};

async function load(){var r=await sb.from('projects').select('*').order('sort_order').order('created_at');rows=r.data||[];list()}
function list(){var b=$('#list');b.innerHTML=rows.length?'':'<p style="color:#6b645a">No renders yet.</p>';
  rows.forEach(function(r,i){var d=document.createElement('div');d.className='it';
    var info=[r.home_type,r.area&&r.area+' sq ft',r.location].filter(Boolean).join(' · ')+(r.published?'':' · HIDDEN')+(r.is_hero?' · OPENING SCREEN':'');
    d.innerHTML='<img src="'+esc(r.image_url)+'" alt=""><div><b>'+esc(r.name)+'</b><br><small>'+esc(info)+'</small><div class="bt">'+
      ['↑','↓',r.published?'Hide':'Show','Edit','Delete'].map(function(t,k){return '<button class="s" data-k="'+k+'">'+t+'</button>'}).join('')+'</div></div>';
    d.onclick=function(e){var k=e.target.dataset.k;if(k!=null)act(i,+k)};b.appendChild(d)})}
async function act(i,k){var r=rows[i];
  if(k<2){var j=i+(k?1:-1);if(j<0||j>=rows.length)return;var t=rows[i];rows[i]=rows[j];rows[j]=t;
    await Promise.all(rows.map(function(x,n){return sb.from('projects').update({sort_order:n+1}).eq('id',x.id)}))}
  else if(k==2)await sb.from('projects').update({published:!r.published}).eq('id',r.id);
  else if(k==3){fill(r);scrollTo(0,0);return}
  else if(confirm('Delete "'+r.name+'" permanently?')){var p=(r.image_url.split('/renders/')[1]||'');await sb.from('projects').delete().eq('id',r.id);if(p)await sb.storage.from('renders').remove([p])}
  load()}

var F={nm:'name',ht:'home_type',ar:'area',lc:'location',fs:'featured_space',cc:'concept',p1:'phil_idea',p2:'phil_materials',p3:'phil_space'};
function fill(r){edit=r;blob=null;for(var k in F)$('#'+k).value=r[F[k]]||'';$('#tn').value=r.text_tone||'auto';$('#hero').checked=!!r.is_hero;
  $('#sws').value=(r.swatches||[]).join(', ');$('#pv').src=r.image_url;$('#pv').classList.remove('hid');$('#file').value='';
  $('#ft').textContent='Editing: '+r.name;$('#cancel').classList.remove('hid');msg('Choose a new render only if you want to replace the image.')}
function reset(){edit=null;blob=null;for(var k in F)$('#'+k).value='';$('#tn').value='auto';$('#hero').checked=false;$('#sws').value='';$('#file').value='';
  $('#pv').classList.add('hid');$('#ft').textContent='New render';$('#cancel').classList.add('hid')}
$('#cancel').onclick=function(){reset();msg('')};

function palette(img){var c=document.createElement('canvas');c.width=40;c.height=70;var x=c.getContext('2d');x.drawImage(img,0,0,40,70);
  var d=x.getImageData(0,0,40,70).data,m={};
  for(var i=0;i<d.length;i+=4){var k=[d[i]>>5,d[i+1]>>5,d[i+2]>>5].join();var o=m[k]||(m[k]={n:0,r:0,g:0,b:0});o.n++;o.r+=d[i];o.g+=d[i+1];o.b+=d[i+2]}
  return Object.values(m).sort(function(a,b){return b.n-a.n}).slice(0,5).map(function(o){return[o.r/o.n,o.g/o.n,o.b/o.n]})
    .sort(function(a,b){return(b[0]+b[1]+b[2])-(a[0]+a[1]+a[2])})
    .map(function(c){return '#'+c.map(function(n){return Math.round(n).toString(16).padStart(2,'0')}).join('')})}
$('#file').onchange=function(){var f=this.files[0];if(!f)return;var img=new Image();
  img.onload=function(){var w=Math.min(1170,img.width),h=Math.round(img.height*w/img.width),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
    c.toBlob(function(b){blob=b;$('#pv').src=URL.createObjectURL(b);$('#pv').classList.remove('hid')},'image/webp',.82);$('#sws').value=palette(img).join(', ')};
  img.src=URL.createObjectURL(f)};

$('#save').onclick=async function(){
  if(!v('nm'))return msg('Project name is required.',1);
  if(!edit&&!blob)return msg('Choose a render first.',1);
  msg('Saving...');var url=edit?edit.image_url:null;
  if(blob){var path=Date.now()+'.webp',u=await sb.storage.from('renders').upload(path,blob,{contentType:'image/webp',cacheControl:'31536000'});
    if(u.error)return msg(u.error.message,1);url=sb.storage.from('renders').getPublicUrl(path).data.publicUrl}
  var rec={image_url:url,text_tone:$('#tn').value,is_hero:$('#hero').checked,swatches:v('sws').split(',').map(function(s){return s.trim()}).filter(Boolean)};
  for(var k in F)rec[F[k]]=v(k);
  var r;if(edit)r=await sb.from('projects').update(rec).eq('id',edit.id);
  else{rec.sort_order=rows.reduce(function(m,x){return Math.max(m,x.sort_order||0)},0)+1;r=await sb.from('projects').insert(rec)}
  if(r.error)return msg(r.error.message,1);
  reset();msg('Published. It is live on the portfolio now.');load()};
</script></body></html>
